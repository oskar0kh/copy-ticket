spring.application.name=copy-ticket-test

# ==================================
# DATA SOURCE (PostgreSQL - 테스트용, 같은 DB 사용하되 트랜잭션으로 격리)
# ==================================
spring.datasource.url=jdbc:postgresql://localhost:5432/copy_ticket_db
spring.datasource.username=kunhyung
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================================
# REDIS (테스트용)
# ==================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==================================
# JPA (Hibernate 설정)
# ==================================
# 테스트 시에는 매번 테이블을 재생성 (데이터 격리)
spring.jpa.hibernate.ddl-auto=create-drop

# SQL 조회 비활성화 (테스트 속도 향상)
spring.jpa.show-sql=false

# SQL 포맷팅 비활성화
spring.jpa.properties.hibernate.format_sql=false

# 타임존 설정
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ==================================
# LOGGING (테스트 로그 레벨 - WARN 이상만 표시)
# ==================================
logging.level.root=WARN
logging.level.copy_ticket=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
